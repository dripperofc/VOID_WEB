<style>
:root {
  --bg0: #08080a;
  --bg1: #0d0d11;
  --bg2: #121216;
  --bg3: #18181f;
  --bg4: #1f1f28;
  --accent: #e8e8f0;
  --accent2: #ffffff;
  --text: #e8e8f0;
  --muted: #505068;
  --muted2: #383850;
  --border: #1e1e2a;
  --green: #3fcf8e;
  --red: #f75959;
  --yellow: #f5c842;
  --radius: 6px;
  --sidebar-w: 56px;
  --channels-w: 200px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--bg0); color: var(--text);
  font-family: 'Space Mono', monospace; font-size: 13px;
  display: flex; flex-direction: column;
}
input, textarea, button { font-family: inherit; }
button { cursor: pointer; }

/* ── LOGIN ── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: var(--bg0);
}
.login-wrap { width: 360px; }
.login-logo {
  font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
  letter-spacing: 8px; color: var(--text); margin-bottom: 2px;
}
.login-sub { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-bottom: 28px; }
.login-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.ltab {
  flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  padding: 10px; transition: all .15s;
}
.ltab.active { color: var(--text); border-bottom-color: var(--text); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field input {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; padding: 9px 11px; outline: none;
}
.field input:focus { border-color: var(--muted); }
.btn-p {
  width: 100%; background: var(--text); color: var(--bg0); border: none;
  font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  padding: 11px; cursor: pointer; transition: opacity .15s;
}
.btn-p:hover { opacity: .85; }
.btn-p:disabled { opacity: .4; pointer-events: none; }
#login-err { color: var(--red); font-size: 10px; margin-top: 12px; display: none; }

/* ── APP ── */
#app { display: none; flex: 1; height: 100vh; }

/* SERVER BAR */
.srv-bar {
  width: var(--sidebar-w); background: var(--bg1);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0; gap: 6px; border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0;
}
.srv-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--muted); font-size: 16px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .12s; position: relative;
}
.srv-btn:hover { border-color: var(--muted); color: var(--text); border-radius: 12px; }
.srv-btn.active { border-color: var(--text); color: var(--text); border-radius: 12px; background: var(--bg3); }
.srv-btn .badge {
  position: absolute; top: -4px; right: -4px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--red); color: var(--bg0);
  font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.srv-sep { width: 26px; height: 1px; background: var(--border); margin: 4px 0; }
#srv-list { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.srv-add { border-style: dashed; color: var(--muted2); font-size: 18px; }

/* CHANNELS PANEL */
.channels-panel {
  width: var(--channels-w); background: var(--bg2);
  display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0;
}
.cp-header {
  padding: 14px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.cp-title {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase;
}
.cp-body { flex: 1; overflow-y: auto; padding: 8px 0; }

.cp-section { padding: 0 10px; margin-bottom: 6px; }
.cp-label {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); padding: 8px 4px 4px;
}
.cp-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius);
  color: var(--muted); font-size: 11px; cursor: pointer;
  transition: all .1s;
}
.cp-item:hover { background: var(--bg3); color: var(--text); }
.cp-item.active { background: var(--bg4); color: var(--text); }
.cp-item .st { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.cp-item .st.on { background: var(--green); }
.cp-item .st.off { background: var(--muted2); }
.cp-item .act { margin-left: auto; font-size: 9px; color: var(--muted); display: flex; gap: 4px; }
.cp-item .act button {
  background: none; border: none; color: var(--muted); font-size: 9px; padding: 1px 3px;
}
.cp-item .act button:hover { color: var(--text); }

.inp-s {
  display: flex; gap: 4px; padding: 4px 10px;
}
.inp-s input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); font-size: 10px; padding: 5px 7px; outline: none;
}
.inp-s input:focus { border-color: var(--muted); }
.inp-s button {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; padding: 5px 7px;
}
.inp-s button:hover { border-color: var(--muted); color: var(--text); }

/* VOICE BAR */
.voice-bar {
  display: none; padding: 10px 12px; border-top: 1px solid var(--border);
  background: var(--bg3); align-items: center; gap: 8px;
}
.voice-bar .st { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.voice-bar .nm { font-size: 10px; flex: 1; }
.voice-bar .tm { font-size: 9px; color: var(--muted); }
.vb-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 3px 6px; }
.vb-btn:hover { border-color: var(--muted); color: var(--text); }
.vb-btn.muted { border-color: var(--red); color: var(--red); }

/* USER BAR */
.user-bar {
  padding: 10px 12px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; background: var(--bg2);
}
.user-av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.user-nm { font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-act { display: flex; gap: 4px; }
.uab {
  background: none; border: none; color: var(--muted); font-size: 13px;
  padding: 2px; transition: color .1s;
}
.uab:hover { color: var(--text); }
.uab.muted { color: var(--red); }

/* CHAT AREA */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-topbar {
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.chat-topbar-ic { font-size: 14px; }
.chat-topbar-nm { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 0; }

.messages {
  flex: 1; overflow-y: auto; padding: 12px 18px;
  display: flex; flex-direction: column; gap: 2px;
}
.msg-g { display: flex; gap: 10px; padding: 4px 0; }
.msg-g:hover { background: var(--bg1); }
.msg-av {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; margin-top: 2px;
}
.msg-b { flex: 1; min-width: 0; }
.msg-h { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
.msg-n { font-size: 12px; font-weight: 700; }
.msg-t { font-size: 9px; color: var(--muted); }
.msg-c { font-size: 12px; line-height: 1.5; word-break: break-word; }
.empty-chat {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: var(--muted2);
}
.empty-chat .big { font-size: 32px; margin-bottom: 6px; }
.empty-chat p { font-size: 11px; }

.chat-input-wrap { padding: 12px 18px 16px; flex-shrink: 0; }
.chat-input-box {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg2); border: 1px solid var(--border); padding: 8px 10px;
}
.chat-input-box:focus-within { border-color: var(--muted); }
.chat-input {
  flex: 1; background: none; border: none; color: var(--text);
  font-size: 12px; outline: none; resize: none; line-height: 1.5; max-height: 120px;
}
.send-btn {
  background: none; border: none; color: var(--muted); font-size: 16px;
  padding: 2px 4px; transition: color .1s;
}
.send-btn:hover { color: var(--text); }

/* CALL POPUP */
.call-popup {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: #00000099; align-items: center; justify-content: center;
}
.call-popup.open { display: flex; }
.call-box { background: var(--bg2); border: 1px solid var(--border); padding: 32px; text-align: center; width: 320px; }
.call-box .from { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.call-box .name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.call-box .actions { display: flex; gap: 12px; justify-content: center; }
.call-box .actions button {
  width: 80px; height: 48px; border: 1px solid var(--border); font-size: 18px;
  background: var(--bg3); color: var(--text); transition: all .12s;
}
.call-box .actions button:hover { border-color: var(--muted); }
.call-box .actions .acc { border-color: var(--green); color: var(--green); }
.call-box .actions .acc:hover { background: var(--green); color: var(--bg0); }
.call-box .actions .dec { border-color: var(--red); color: var(--red); }
.call-box .actions .dec:hover { background: var(--red); color: var(--bg0); }

/* MODAL */
.modal-bg {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: #00000099; align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); padding: 28px; width: 380px; }
.modal h3 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
.modal p { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.modal .field { margin-bottom: 12px; }
.modal .field input { font-size: 12px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.modal .actions .btn { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 7px 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); }
.modal .actions .btn:hover { border-color: var(--muted); color: var(--text); }
.modal .actions .btn.p { background: var(--text); color: var(--bg0); border-color: var(--text); font-weight: 700; }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); font-size: 11px; padding: 9px 14px;
  z-index: 9999; transition: all .3s;
  transform: translateY(20px); opacity: 0;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok { border-color: var(--green); }
.toast.er { border-color: var(--red); }

@media (max-width: 768px) {
  .srv-bar { width: 48px; }
  .srv-btn { width: 34px; height: 34px; font-size: 14px; }
  .channels-panel { width: 160px; }
  .messages { padding: 8px 12px; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">VOID</div>
    <div class="login-sub">CHAT EM TEMPO REAL</div>
    <div class="login-tabs">
      <button class="ltab active" onclick="setAuthTab('login')">Entrar</button>
      <button class="ltab" onclick="setAuthTab('register')">Criar conta</button>
    </div>
    <div class="field"><label>Usuário</label><input type="text" id="auth-user" autocomplete="off"></div>
    <div class="field" id="field-nick" style="display:none"><label>Apelido</label><input type="text" id="auth-nick" autocomplete="off"></div>
    <div class="field"><label>Senha</label><input type="password" id="auth-pass"></div>
    <button class="btn-p" id="auth-btn" onclick="doAuth()">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="app">
  <div style="display:flex;flex:1">
    <!-- SERVER BAR -->
    <div class="srv-bar">
      <button class="srv-btn active" id="srv-dm" onclick="showDMs()" title="Mensagens">@</button>
      <div class="srv-sep"></div>
      <div id="srv-list"></div>
      <div class="srv-sep"></div>
      <button class="srv-btn srv-add" onclick="openModal('modal-addserver')" title="Criar servidor">+</button>
    </div>

    <!-- CHANNELS PANEL -->
    <div class="channels-panel">
      <div class="cp-header">
        <div class="cp-title" id="cp-title">Mensagens</div>
      </div>
      <div class="cp-body" id="cp-body"></div>
      <div class="voice-bar" id="voice-bar">
        <div class="st"></div>
        <div class="nm" id="voice-peer">—</div>
        <div class="tm" id="voice-timer">00:00</div>
        <button class="vb-btn" id="voice-mute" onclick="toggleVoiceMute()" title="Mute">🎤</button>
        <button class="vb-btn" onclick="endVoiceCall()" title="Desligar">✕</button>
      </div>
      <div class="user-bar">
        <div class="user-av" id="my-av" style="background:var(--bg4)">?</div>
        <div class="user-nm" id="my-name">—</div>
        <div class="user-act">
          <button class="uab" id="self-mute" onclick="toggleSelfMute()" title="Mute">🔊</button>
          <button class="uab" onclick="doLogout()" title="Sair">✕</button>
        </div>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area">
      <div class="chat-topbar">
        <span class="chat-topbar-ic" id="topbar-ic">@</span>
        <span class="chat-topbar-nm" id="topbar-nm">Mensagens</span>
      </div>
      <div class="messages" id="messages">
        <div class="empty-chat">
          <div class="big">💬</div>
          <p>Selecione uma conversa para começar</p>
        </div>
      </div>
      <div class="chat-input-wrap" id="input-wrap">
        <div class="chat-input-box">
          <textarea class="chat-input" id="chat-input" rows="1" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
          <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="call-popup" id="call-popup">
  <div class="call-box">
    <div class="from">chamada recebida</div>
    <div class="name" id="call-name">—</div>
    <div class="actions">
      <button class="acc" onclick="acceptCall()">📞</button>
      <button class="dec" onclick="declineCall()">✕</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-addserver" onclick="if(event.target===this)closeModal('modal-addserver')">
  <div class="modal">
    <h3>Criar Servidor</h3>
    <p>Dê um nome e crie o primeiro canal.</p>
    <div class="field"><label>Nome do servidor</label><input type="text" id="srv-name-inp"></div>
    <div class="field"><label>Primeiro canal</label><input type="text" id="srv-chan-inp" value="geral"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('modal-addserver')">Cancelar</button>
      <button class="btn p" onclick="addServer()">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVER_URL = 'https://void-server-qz9e.onrender.com';
let conn = null, me = null;
let currentChat = null;
let friends = [], pendingReqs = [], servers = [], onlineFriends = {};
let selfMuted = false;
let inCall = false, callPeer = null, callTimer = null, callSeconds = 0;
let localStream = null, peerConn = null;
let isAuthRegister = false;

// ─── AUTH ───
function setAuthTab(tab) {
  isAuthRegister = tab === 'register';
  document.querySelectorAll('.ltab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.ltab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('field-nick').style.display = isAuthRegister ? 'block' : 'none';
  document.querySelector('.login-sub').textContent = isAuthRegister ? 'CRIAR CONTA' : 'CHAT EM TEMPO REAL';
  document.getElementById('auth-btn').textContent = isAuthRegister ? 'Criar conta' : 'Entrar';
  document.getElementById('login-err').style.display = 'none';
}

async function doAuth() {
  const user = document.getElementById('auth-user').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const nick = document.getElementById('auth-nick').value.trim() || user;
  if (!user || !pass) return;
  const btn = document.getElementById('auth-btn');
  btn.textContent = 'Conectando...'; btn.disabled = true;
  document.getElementById('login-err').style.display = 'none';

  try {
    await loadSignalR();
    conn = new signalR.HubConnectionBuilder()
      .withUrl(`${SERVER_URL}/voidchat?username=${encodeURIComponent(user)}`)
      .withAutomaticReconnect([0, 2000, 5000, 10000])
      .build();
    setupHubEvents();

    await conn.start();
    const result = await conn.invoke('AuthenticateUser', user, pass, isAuthRegister, nick);
    if (!result || result.error) throw new Error(result?.error || 'Auth failed');

    const profile = await conn.invoke('GetUserProfile', user);
    me = { username: user, ...profile };

    try {
      const reqs = await conn.invoke('GetPendingRequests', user);
      pendingReqs = reqs || [];
    } catch {}

    launchApp();
  } catch(e) {
    btn.textContent = isAuthRegister ? 'Criar conta' : 'Entrar';
    btn.disabled = false;
    const el = document.getElementById('login-err');
    el.textContent = e.message || 'Erro ao conectar';
    el.style.display = 'block';
  }
}

// ─── HUB EVENTS ───
function setupHubEvents() {
  conn.on('UserStatusChanged', (u, on) => {
    onlineFriends[u] = on;
    if (document.querySelector(`[data-dm="${u}"]`)) renderDMPanel();
  });
  conn.on('ReceivePrivateMessage', (msg, from) => {
    if (currentChat?.type === 'dm' && currentChat?.id === from) {
      appendMsg(me.nickname, from, msg, null, false);
    } else {
      toast(`✉ ${from}`, '');
      const el = document.querySelector(`[data-dm="${from}"] .badge`);
      if (el) el.textContent = (parseInt(el.textContent)||0)+1; el.style.display='flex';
    }
  });
  conn.on('ReceiveMessage', (msg) => {
    const { from, content, serverId, channelId } = msg || {};
    if (currentChat?.type === 'channel' && currentChat?.serverId === serverId && currentChat?.id === channelId)
      appendMsg(me.nickname, from, content, null, false);
  });
  conn.on('ReceiveFriendRequest', (from) => {
    if (!pendingReqs.includes(from)) pendingReqs.push(from);
    renderDMPanel();
    toast(`✉ Pedido de amizade: ${from}`, '');
  });
  conn.on('FriendAccepted', (user) => {
    if (!friends.includes(user)) friends.push(user);
    pendingReqs = pendingReqs.filter(r => r !== user);
    renderDMPanel();
    toast(`✓ ${user} aceitou seu pedido`, 'ok');
  });
  conn.on('FriendRequestFailed', (m) => toast(m, 'er'));
  conn.on('FriendRequestSent', () => toast('Pedido enviado', 'ok'));
  conn.on('Kicked', () => { toast('Desconectado pelo admin', 'er'); setTimeout(doLogout, 2000); });
  conn.on('VoiceCallIncoming', (from) => {
    callPeer = from;
    document.getElementById('call-name').textContent = from;
    document.getElementById('call-popup').classList.add('open');
  });
  conn.on('VoiceCallAccepted', (from) => { toast('Chamada aceita', 'ok'); startWebRTC(from, true); });
  conn.on('VoiceCallDeclined', (from) => { toast(`${from} recusou`, 'er'); endVoiceCall(); });
  conn.on('VoiceCallEnded', (from) => { toast('Chamada encerrada', ''); endVoiceCall(); });
  conn.on('VoiceOffer', async (from, sdp) => {
    if (!peerConn) await startWebRTC(from, false);
    try { await peerConn.setRemoteDescription(JSON.parse(sdp)); const a = await peerConn.createAnswer(); await peerConn.setLocalDescription(a); await conn.invoke('SendVoiceAnswer', from, JSON.stringify(a)); } catch(e) { console.log(e); }
  });
  conn.on('VoiceAnswer', async (from, sdp) => {
    try { await peerConn.setRemoteDescription(JSON.parse(sdp)); } catch(e) { console.log(e); }
  });
  conn.on('VoiceIce', async (from, cand) => {
    try { await peerConn.addIceCandidate(JSON.parse(cand)); } catch(e) { console.log(e); }
  });
  conn.onreconnecting(() => toast('Reconectando...', ''));
  conn.onreconnected(() => toast('Reconectado', 'ok'));
}

// ─── LAUNCH ───
function launchApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const av = document.getElementById('my-av');
  av.textContent = (me.nickname || me.username)[0].toUpperCase();
  av.style.background = me.avatarColor || '#26262f';
  document.getElementById('my-name').textContent = me.nickname || me.username;
  friends = me.friends || [];
  renderServers();
  showDMs();
}

// ─── SERVERS ───
function renderServers() {
  const el = document.getElementById('srv-list');
  el.innerHTML = (servers||[]).map((s,i) =>
    `<button class="srv-btn" onclick="selectServer(${i})" title="${esc(s.name)}">${esc(s.name[0]||'#')}</button>`
  ).join('');
}

function selectServer(i) {
  const s = servers[i];
  if (!s) return;
  document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.srv-btn')[i+1]?.classList.add('active');
  document.getElementById('srv-dm').classList.remove('active');
  document.getElementById('cp-title').textContent = s.name;
  if (s.channels) {
    const body = document.getElementById('cp-body');
    body.innerHTML = `<div class="cp-section"><div class="cp-label">Canais</div>${
      s.channels.map((ch, ci) =>
        `<div class="cp-item" onclick="selectChannel(${i}, ${ci})"># ${esc(ch)}</div>`
      ).join('')
    }</div>`;
  }
  currentChat = { type: 'server', id: i, name: s.name };
  resetChat(s.name, '🖥');
  if (s.channels?.[0]) selectChannel(i, 0);
}

function addServer() {
  const name = document.getElementById('srv-name-inp').value.trim();
  const chan = document.getElementById('srv-chan-inp').value.trim() || 'geral';
  if (!name) return;
  servers.push({ name, channels: [chan] });
  closeModal('modal-addserver');
  document.getElementById('srv-name-inp').value = '';
  renderServers();
  selectServer(servers.length-1);
}

// ─── DMs ───
function showDMs() {
  document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('srv-dm').classList.add('active');
  document.getElementById('cp-title').textContent = 'Mensagens';
  currentChat = null;
  renderDMPanel();
}

function renderDMPanel() {
  const body = document.getElementById('cp-body');
  let html = '';

  if (pendingReqs.length) {
    html += `<div class="cp-section"><div class="cp-label">Pedidos (${pendingReqs.length})</div>${
      pendingReqs.map(u =>
        `<div class="cp-item">${esc(u)}<div class="act"><button onclick="acceptReq('${esc(u)}')">✓</button><button onclick="declineReq('${esc(u)}')">✕</button></div></div>`
      ).join('')
    }</div>`;
  }

  const online = friends.filter(f => onlineFriends[f]);
  const offline = friends.filter(f => !onlineFriends[f]);

  html += `<div class="cp-section"><div class="cp-label">Online — ${online.length}</div>${
    online.map(u =>
      `<div class="cp-item" onclick="selectDM('${esc(u)}')" data-dm="${esc(u)}"><span class="st on"></span>${esc(u)}<div class="act"><button onclick="event.stopPropagation();callUser('${esc(u)}')" title="Chamar">📞</button></div></div>`
    ).join('')
  }</div>`;

  if (offline.length) {
    html += `<div class="cp-section"><div class="cp-label">Offline — ${offline.length}</div>${
      offline.map(u =>
        `<div class="cp-item" onclick="selectDM('${esc(u)}')" data-dm="${esc(u)}"><span class="st off"></span>${esc(u)}</div>`
      ).join('')
    }</div>`;
  }

  html += `<div class="inp-s"><input id="add-friend-inp" placeholder="adicionar amigo..." onkeydown="if(event.key==='Enter')sendFriendReq()"><button onclick="sendFriendReq()">+</button></div>`;

  body.innerHTML = html || '<div class="empty-chat" style="padding:20px"><p style="font-size:11px;color:var(--muted2)">Nenhum amigo ainda</p></div>';
  resetChat('Mensagens', '@');
}

// ─── SELECT DM ───
async function selectDM(user) {
  document.querySelectorAll('.cp-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`[data-dm="${user}"]`);
  if (el) el.classList.add('active');
  const badge = el?.querySelector('.badge');
  if (badge) { badge.style.display = 'none'; badge.textContent = '0'; }
  currentChat = { type: 'dm', id: user, name: user };
  document.getElementById('topbar-ic').textContent = '@';
  document.getElementById('topbar-nm').textContent = user;
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div class="empty-chat"><p style="font-size:11px;color:var(--muted2)">Carregando...</p></div>';
  try {
    const history = await conn.invoke('GetChatHistory', user);
    msgs.innerHTML = '';
    if (history?.length) history.forEach(m => appendMsg(me.nickname, m.from || user, m.content || m, null, true));
    if (!msgs.children.length) msgs.innerHTML = '<div class="empty-chat"><p style="font-size:11px;color:var(--muted2)">Nenhuma mensagem</p></div>';
  } catch { msgs.innerHTML = '<div class="empty-chat"><p style="font-size:11px;color:var(--muted2)">Erro ao carregar</p></div>'; }
}

// ─── SELECT CHANNEL ───
async function selectChannel(si, ci) {
  const s = servers[si];
  if (!s?.channels?.[ci]) return;
  const ch = s.channels[ci];
  document.querySelectorAll('.cp-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.cp-item')[ci]?.classList.add('active');
  currentChat = { type: 'channel', serverId: `srv_${si}_${Date.now()}`, id: `chan_${ci}`, name: ch };
  document.getElementById('topbar-ic').textContent = '#';
  document.getElementById('topbar-nm').textContent = `${s.name} / ${ch}`;
  resetChat(`${s.name} / ${ch}`, '#');
  try { await conn.invoke('JoinChannel', currentChat.serverId, currentChat.id); } catch {}
}

function resetChat(name, icon) {
  document.getElementById('topbar-ic').textContent = icon;
  document.getElementById('topbar-nm').textContent = name;
  document.getElementById('messages').innerHTML = '<div class="empty-chat"><p style="font-size:11px;color:var(--muted2)">Nenhuma mensagem</p></div>';
}

// ─── MESSAGES ───
function appendMsg(myNick, from, content, color, prepend) {
  const msgs = document.getElementById('messages');
  if (prepend && msgs.querySelector('.empty-chat')) msgs.innerHTML = '';
  const g = document.createElement('div');
  g.className = 'msg-g';
  const initial = (from||'?')[0].toUpperCase();
  g.innerHTML = `<div class="msg-av" style="background:${color||'#26262f'}">${initial}</div><div class="msg-b"><div class="msg-h"><span class="msg-n" style="color:${color||'var(--text)'}">${esc(from)}</span><span class="msg-t">${new Date().toLocaleTimeString()}</span></div><div class="msg-c">${esc(content||'')}</div></div>`;
  if (prepend) msgs.insertBefore(g, msgs.firstChild);
  else { msgs.appendChild(g); msgs.scrollTop = msgs.scrollHeight; }
}

function sendMessage() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text || !currentChat) return;
  inp.value = '';
  if (currentChat.type === 'dm') {
    conn.invoke('SendPrivateMessage', me.nickname, currentChat.id, text).catch(e => toast('Erro: '+e.message, 'er'));
    appendMsg(me.nickname, me.nickname, text, null, false);
  } else if (currentChat.type === 'channel') {
    conn.invoke('SendMessage', me.nickname, text, '', '', currentChat.serverId, currentChat.id).catch(e => toast('Erro: '+e.message, 'er'));
    appendMsg(me.nickname, me.nickname, text, null, false);
  }
}

// ─── FRIENDS ───
function sendFriendReq() {
  const inp = document.getElementById('add-friend-inp');
  const target = inp.value.trim();
  if (!target) return;
  inp.value = '';
  conn.invoke('SendFriendRequest', target).catch(e => toast('Erro: '+e.message, 'er'));
}
async function acceptReq(user) {
  try { await conn.invoke('AcceptFriendRequest', user); pendingReqs = pendingReqs.filter(r => r !== user); if (!friends.includes(user)) friends.push(user); renderDMPanel(); } catch(e) { toast('Erro: '+e.message, 'er'); }
}
async function declineReq(user) {
  try { await conn.invoke('DeclineFriendRequest', user); pendingReqs = pendingReqs.filter(r => r !== user); renderDMPanel(); } catch(e) { toast('Erro: '+e.message, 'er'); }
}

// ─── VOICE ───
async function callUser(target) {
  callPeer = target;
  document.getElementById('voice-peer').textContent = target;
  document.getElementById('voice-bar').style.display = 'flex';
  try { await conn.invoke('StartVoiceCall', target); } catch(e) { toast('Erro: '+e.message, 'er'); }
}
function acceptCall() {
  document.getElementById('call-popup').classList.remove('open');
  document.getElementById('voice-peer').textContent = callPeer;
  document.getElementById('voice-bar').style.display = 'flex';
  conn.invoke('AcceptVoiceCall', callPeer).catch(() => {});
  startWebRTC(callPeer, false);
}
function declineCall() {
  document.getElementById('call-popup').classList.remove('open');
  conn.invoke('DeclineVoiceCall', callPeer).catch(() => {});
  callPeer = null;
}
async function startWebRTC(peer, isInitiator) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    peerConn = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    peerConn.onicecandidate = e => { if (e.candidate) conn.invoke('SendVoiceIce', peer, JSON.stringify(e.candidate)).catch(() => {}); };
    peerConn.ontrack = e => { /* remote audio track */ };
    localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
    if (isInitiator) {
      const offer = await peerConn.createOffer();
      await peerConn.setLocalDescription(offer);
      await conn.invoke('SendVoiceOffer', peer, JSON.stringify(offer));
    }
    inCall = true;
    startCallTimer();
  } catch(e) { toast('Erro de áudio: '+e.message, 'er'); endVoiceCall(); }
}
function toggleVoiceMute() {
  const btn = document.getElementById('voice-mute');
  if (localStream) { localStream.getAudioTracks().forEach(t => t.enabled = !t.enabled); }
  btn.classList.toggle('muted');
  btn.textContent = btn.classList.contains('muted') ? '🔇' : '🎤';
}
function toggleSelfMute() {
  selfMuted = !selfMuted;
  const btn = document.getElementById('self-mute');
  btn.textContent = selfMuted ? '🔇' : '🔊';
  btn.classList.toggle('muted');
}
function endVoiceCall() {
  document.getElementById('voice-bar').style.display = 'none';
  document.getElementById('call-popup').classList.remove('open');
  stopCallTimer();
  if (peerConn) { peerConn.close(); peerConn = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (inCall && callPeer) conn.invoke('EndVoiceCall', callPeer).catch(() => {});
  inCall = false; callPeer = null;
}
function startCallTimer() { callSeconds = 0; callTimer = setInterval(() => { callSeconds++; const m = String(Math.floor(callSeconds/60)).padStart(2,'0'); const s = String(callSeconds%60).padStart(2,'0'); document.getElementById('voice-timer').textContent = `${m}:${s}`; }, 1000); }
function stopCallTimer() { clearInterval(callTimer); callTimer = null; document.getElementById('voice-timer').textContent = '00:00'; }

// ─── LOGOUT ───
function doLogout() {
  if (inCall) endVoiceCall();
  if (conn) conn.stop().catch(() => {});
  me = null; currentChat = null; friends = []; pendingReqs = []; servers = []; onlineFriends = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ─── UI HELPERS ───
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}
function loadSignalR() {
  if (window.signalR) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
</script>
